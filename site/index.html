<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/island.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/scene3d.css">
  <!-- 3D 視覺實驗版：Three.js 放在 vendor/（不連外部 CDN），用 importmap 對應 "three" -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
  <link rel="modulepreload" href="vendor/three/three.core.min.js" fetchpriority="low">
  <link rel="modulepreload" href="vendor/three/three.module.min.js" fetchpriority="low">
  <link rel="modulepreload" href="js/scene3d.js" fetchpriority="low">
  <!-- 首次載入：先列出所有模組，瀏覽器可以同時下載，不必一層一層等 import -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/text.js">
  <link rel="modulepreload" href="js/parallax.js">
  <link rel="modulepreload" href="js/data-loader.js">
  <link rel="modulepreload" href="js/layout.js">
  <link rel="modulepreload" href="js/terrain.js">
  <link rel="modulepreload" href="js/map.js">
  <link rel="modulepreload" href="js/nodes.js">
  <link rel="modulepreload" href="js/connections.js">
  <link rel="modulepreload" href="js/panel.js">
  <link rel="modulepreload" href="js/detail.js">
  <link rel="modulepreload" href="js/router.js">
  <link rel="modulepreload" href="js/progress.js">
  <link rel="modulepreload" href="js/guide.js">
  <link rel="modulepreload" href="js/theme3d.js">
</head>
<body>
  <header class="top wrap">
    <div class="title-card">
      <p class="owner" id="site-owner"></p>
      <h1 id="site-title"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="total"><span data-t="site.totalBefore"></span><strong id="total-header"></strong><span data-t="site.totalAfter"></span></p>
      <div class="mode-switch" role="group" data-t-aria="site.modeGroup">
        <button type="button" id="mode-map" aria-pressed="true"><span aria-hidden="true">⬡</span> <span data-t="site.modeMap"></span></button>
        <button type="button" id="mode-list" aria-pressed="false"><span aria-hidden="true">☰</span> <span data-t="site.modeList"></span></button>
      </div>
    </div>
    <details class="about" id="about" open>
      <summary><h2 id="about-heading"></h2></summary>
      <div id="intro"></div>
    </details>
  </header>

  <main class="wrap">
    <section id="map-mode" class="stage-wrap" data-t-aria="site.stageLabel">
      <div class="stage" id="stage">
        <div class="sea-fx" aria-hidden="true">
          <div class="waves"></div>
          <svg class="boat b1" viewBox="0 0 40 40"><path class="hull" d="M5 27 L35 27 L30 34 L10 34 Z"/><path class="mast" d="M20 6 V27"/><path class="sail" d="M21 7 L33 25 L21 25 Z"/><path class="sail2" d="M19 11 L10 25 L19 25 Z"/></svg>
          <svg class="boat b2" viewBox="0 0 40 40"><path class="hull" d="M5 27 L35 27 L30 34 L10 34 Z"/><path class="mast" d="M20 6 V27"/><path class="sail" d="M21 7 L33 25 L21 25 Z"/><path class="sail2" d="M19 11 L10 25 L19 25 Z"/></svg>
        </div>

        <div class="map" id="map"></div>

        <div class="sky-fx" aria-hidden="true">
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="cloud c3"></div>
        </div>

        <aside class="detail" id="detail" hidden aria-live="polite">
          <button type="button" class="detail-close" data-t-aria="detail.close">✕</button>
          <div class="detail-body"></div>
        </aside>

        <div class="guide" id="guide"></div>

        <nav class="toolbar" id="toolbar" data-t-aria="toolbar.label">
          <button type="button" data-act="pano" data-t-title="toolbar.pano"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="tb-label" data-t="toolbar.pano"></span></button>
          <button type="button" data-act="zone" data-t-title="toolbar.zone"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8"/></svg><span class="tb-label" data-t="toolbar.zone"></span></button>
          <button type="button" data-act="out" data-t-title="toolbar.zoomOut" data-t-aria="toolbar.zoomOut"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button type="button" data-act="in" data-t-title="toolbar.zoomIn" data-t-aria="toolbar.zoomIn"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
          <button type="button" data-act="links" aria-pressed="true" data-t-title="toolbar.linksTitle"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18a2 2 0 1 0 0.01 0M18 6a2 2 0 1 0 0.01 0M7.5 16.5l9-9"/></svg><span class="tb-label" data-t="toolbar.links"></span></button>
          <button type="button" data-act="tour" aria-pressed="false" data-t-title="toolbar.tour"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7l-11 7Z"/></svg><span class="tb-label" data-t="toolbar.tour"></span></button>
          <button type="button" data-act="tilt" aria-pressed="false" data-t-title="toolbar.tiltTitle" hidden><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18H7Z M10 18h4"/><path d="M3 9c-1 2-1 4 0 6M21 9c1 2 1 4 0 6"/></svg><span class="tb-label" data-t="toolbar.tilt"></span></button>
          <button type="button" data-act="list" data-t-title="toolbar.listTitle"><svg class="tb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="tb-label" data-t="toolbar.list"></span></button>
        </nav>
      </div>

      <aside class="panel" id="panel" data-t-aria="panel.title">
        <div class="panel-head">
          <h2><span data-t="panel.title"></span> <span class="panel-count" id="total-panel"></span></h2>
          <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="panel" data-t="panel.collapse"></button>
        </div>
        <div class="panel-tools"></div>
        <div class="panel-scroll"></div>
      </aside>
      <button type="button" class="panel-open" id="panel-open" hidden data-t="panel.open"></button>

      <div class="legend" id="legend"></div>
    </section>

    <section id="list-view" class="list-view" hidden data-t-aria="list.label"></section>

    <!-- 以下兩句是唯一寫在畫面程式裡的文字：資料檔讀不到時，畫面無法從資料檔取得文字 -->
    <noscript><p>本站需要啟用 JavaScript 才能顯示作品。</p></noscript>
    <p id="load-error" class="load-error" hidden>作品資料載入失敗。請以本機靜態伺服器開啟（見 README），不要直接用 file:// 開檔。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer-text"></div>
    <!-- 實驗版標示（不在資料檔裡：資料檔與主站共用、一字不改） -->
    <div class="wrap lab-note">3D 視覺實驗版</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
